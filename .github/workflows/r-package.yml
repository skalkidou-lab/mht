on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

name: Check and pkgdown

jobs:
  r-package:
    permissions:
      contents: write
    uses: papadopoulos-lab/pptemplate/.github/workflows/r-package.yml@33abc413dbe3dbe21b37b2a4ba515cdda1c008e6
    with:
      # Every entry below is a DATED, FROZEN artefact. mht changes behaviour by
      # creating a new dated function, never by editing an existing one, so
      # these lints cannot be fixed: fixing them would edit a frozen file.
      # Delete an entry only when its file is deleted.
      lint-allowlist: |
        R/lmed-v20230509.R:cyclocomp_linter
        R/lmed-v20230509.R:nonportable_path_linter
        R/lmed-v20230509.R:return_linter
        R/lmed-v20230509.R:seq_linter
        R/lmed-v20250909.R:condition_call_linter
        R/lmed-v20250909.R:cyclocomp_linter
        R/lmed-v20250909.R:nonportable_path_linter
        R/lmed-v20250909.R:return_linter
        R/lmed-v20250909.R:seq_linter
        R/exposure-v20250909.R:return_linter
        R/exposure-v20250909.R:seq_linter
